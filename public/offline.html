<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAB Tasker — Offline</title>
<style>
  :root { --bg:#1D1730; --surface:#2B2140; --text:#F5F2FA; --text-secondary:#C7BEDE; --accent:#9FE2BF; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .card { max-width: 340px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--text-secondary); font-size: 15px; margin: 0 0 20px; line-height: 1.5; }
  button {
    background: var(--accent); color: var(--surface); border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You&rsquo;re offline</h1>
    <p>BAB Tasker needs an internet connection to load your jobs. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
